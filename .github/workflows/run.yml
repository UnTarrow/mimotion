name: 刷步数

on:
  schedule:
    - cron: '37 8,9,10,11,12,13 * * *'
  workflow_dispatch:

jobs:
  build:
    # ubuntu-latest is Ubuntu 26.04. actions/python-versions publishes
    # CPython 3.8.18 for 24.04 (linux x64) and not for 26.04, so
    # actions/setup-python@v3 fails with "Version 3.8 with arch x64 not found".
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v3
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v3
        with:
          python-version: 3.8
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
        run: |
          pip3 install requests pytz
          python3 main.py
